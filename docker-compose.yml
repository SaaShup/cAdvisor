services:
  cadvisor:
    build:
      context: .
      dockerfile: Dockerfile
    image: gcr.io/cadvisor/cadvisor:v0.60.5
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    networks:
      - web
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    logging:
      driver: syslog
      options:
        syslog-address: "udp://127.0.0.1:5514"
        tag: "{{.Name}}"

networks:
  web:
    external: true
    name: ${WEB_NET:-traefik}
